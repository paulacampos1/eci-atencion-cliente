<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud recibida</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .mensaje {
      max-width: 600px;
      background: white;
      padding: 45px;
      text-align: center;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.10);
    }

    h1 {
      color: #007a33;
      margin-bottom: 18px;
    }

    p {
      color: #444;
      line-height: 1.6;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="mensaje">

    <h1>Gracias por ponerse en contacto con nosotros</h1>

    <p>
      Hemos recibido su reclamación correctamente.
      Nuestro equipo de Atención al Cliente la revisará
      y le dará una respuesta lo antes posible.
    </p>

  </div>

</body>
</html>
